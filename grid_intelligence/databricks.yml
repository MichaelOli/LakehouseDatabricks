# This is a Declarative Automation Bundle definition for grid_intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grid_intelligence
  uuid: d3deb60a-75f1-46e6-afa6-5a1d4add4047

include:
  - resources/*.yml

# Sem isso, mode: development prefixa o schema com o usuário (bronze vira meunome_bronze).
# O isolamento entre ambientes é o catálogo, não o nome do schema.
experimental:
  skip_name_prefix_for_schema: true

variables:
  catalog:
    description: Catalogo do ambiente. O valor vive só no target.
  duracao_minima_interrupcao_min:
    description: Minutos minimos da RN-01. A bronze nao filtra.
    default: "3"
  queda_uc_limiar:
    description: Variacao da UC, negativa, a partir da qual o consumo caiu contra o proprio baseline.
    default: "-0.25"
  estabilidade_conjunto_limiar:
    description: Modulo maximo da variacao do conjunto para a vizinhanca contar como estavel.
    default: "0.10"
  usar_ia:
    description: true usa as funcoes ai_* na silver de texto. false usa regras, com as mesmas colunas.
    default: "true"
  warehouse_id:
    description: SQL warehouse das tasks de governanca e da metric view.
    default: "1d496deecacf10fd"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-55cedd82-08c5.cloud.databricks.com
    variables:
      catalog: grid_dev
      usar_ia: "false"
  prod:
    mode: production
    workspace:
      host: https://dbc-55cedd82-08c5.cloud.databricks.com
      root_path: /Workspace/Users/michaeloliveira38@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
    permissions:
      - user_name: michaeloliveira38@gmail.com
        level: CAN_MANAGE
