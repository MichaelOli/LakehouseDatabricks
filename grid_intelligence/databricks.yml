# This is a Declarative Automation Bundle definition for grid_intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grid_intelligence
  uuid: d3deb60a-75f1-46e6-afa6-5a1d4add4047

include:
  - resources/*.yml

# Sem isso, mode: development prefixa o schema com o usuário (bronze vira meunome_bronze).
# O isolamento entre ambientes é o catálogo, não o nome do schema.
experimental:
  skip_name_prefix_for_schema: true

variables:
  catalog:
    description: Catalogo do ambiente. O valor vive só no target.
  duracao_minima_interrupcao:
    description: Minutos minimos para a interrupcao entrar em DEC e FEC. A bronze nao filtra.
    default: "3"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-55cedd82-08c5.cloud.databricks.com
    variables:
      catalog: grid_dev
  prod:
    mode: production
    workspace:
      host: https://dbc-55cedd82-08c5.cloud.databricks.com
      root_path: /Workspace/Users/michaeloliveira38@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
    permissions:
      - user_name: michaeloliveira38@gmail.com
        level: CAN_MANAGE
