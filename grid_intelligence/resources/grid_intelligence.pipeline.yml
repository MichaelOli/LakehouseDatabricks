resources:
  pipelines:
    grid_intelligence:
      name: grid_intelligence
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      continuous: false
      channel: CURRENT
      root_path: ../src/pipelines/grid_intelligence
      libraries:
        - glob:
            include: ../src/pipelines/grid_intelligence/transformations/**
      configuration:
        catalogo: ${var.catalog}
        schema_raw: ${resources.schemas.raw.name}
        schema_bronze: ${resources.schemas.bronze.name}
        schema_silver: ${resources.schemas.silver.name}
        schema_gold: ${resources.schemas.gold.name}
        volume_landing: /Volumes/${var.catalog}/${resources.schemas.raw.name}/${resources.volumes.landing.name}
        duracao_minima_interrupcao_min: ${var.duracao_minima_interrupcao_min}
        queda_uc_limiar: ${var.queda_uc_limiar}
        estabilidade_conjunto_limiar: ${var.estabilidade_conjunto_limiar}
        usar_ia: ${var.usar_ia}
